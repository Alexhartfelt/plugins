name: Release

# Merging to main is the release. On every push to main this workflow:
#   1. bumps the version of each plugin whose files changed, unless the PR already bumped
#      it by hand (scripts/bump-version.mjs — level from the squash-merge title:
#      "feat:" → minor, "feat!:" / "BREAKING CHANGE" → major, anything else → patch);
#   2. rolls each plugin's CHANGELOG.md "## Unreleased" section into a "## <version>" one
#      (scripts/changelog.mjs) — the notes themselves are written in the PR, see CLAUDE.md
#      → "Release notes";
#   3. commits the bump and the rolled changelog back to main with [skip ci] so it does not
#      trigger itself;
#   4. tags every plugin whose version is new as <plugin>-v<version> and publishes a
#      GitHub Release whose body is that version's changelog section.
#
# Pushing to a protected main needs a token that may bypass the protection. Add a
# fine-grained PAT (contents: write) or GitHub App token as the RELEASE_TOKEN secret;
# without it the workflow falls back to GITHUB_TOKEN, which works only while main is
# unprotected.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, release
    runs-on: ubuntu-latest
    # The bump commit itself carries [skip ci]; this guard covers manual re-runs of it.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Bump versions of changed plugins
        id: bump
        env:
          # github.event.before is the previous tip of main for a normal push. On a
          # force-push or manual dispatch it may be unusable; the script falls back to HEAD~1.
          BASE: ${{ github.event.before }}
        run: node scripts/bump-version.mjs

      # Moves "## Unreleased" to "## <version> — <date>" in each plugin's CHANGELOG.md. Safe to
      # re-run: a changelog that already has a section for the version is left alone.
      - name: Roll changelogs to the released version
        run: |
          set -euo pipefail
          for m in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$m" ] || continue
            name=$(jq -r .name "$m")
            version=$(jq -r '.version // empty' "$m")
            [ -n "$version" ] || continue
            node scripts/changelog.mjs roll "$name" "$version"
          done

      # Not gated on the bump: a PR that set the version by hand still needs its changelog rolled.
      - name: Commit the bump and the rolled changelog
        env:
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          set -euo pipefail
          git add -A plugins/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): ${SUMMARY:-roll changelog} [skip ci]"
          git push origin HEAD:main

      - name: Tag and release plugins with a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          for m in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$m" ] || continue
            name=$(jq -r .name "$m")
            version=$(jq -r '.version // empty' "$m")
            [ -n "$version" ] || { echo "$name has no version — skipping"; continue; }
            tag="${name}-v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 \
               || gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released — skipping"
              continue
            fi
            echo "Releasing $tag at $sha"
            # Body = that version's changelog section, then the install reminder. --generate-notes
            # appends GitHub's own "Full Changelog" compare link underneath.
            notes=$(mktemp)
            {
              node scripts/changelog.mjs extract "$name" "$version"
              echo
              echo "---"
              echo "Plugin \`$name\` version \`$version\`. Update: \`/plugin marketplace update helloretail\` then \`/reload-plugins\`."
            } > "$notes"
            gh release create "$tag" \
              --target "$sha" \
              --title "$tag" \
              --generate-notes \
              --notes-file "$notes"
          done
