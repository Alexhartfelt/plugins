name: CI

# Every PR and every push to main. Merging to main IS the publish step — Claude Code
# installs plugins from this repo over git — so nothing may land on main that fails here.
# Version bumps and tags are handled after merge by release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace & plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Structural checks + `claude plugin validate --strict` (pulled via npx, see scripts/validate.mjs)
      - name: Validate
        run: npm run validate

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  lint-wiki:
    name: Lint wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Provenance frontmatter, links, orphans and customer-identifiable data under
      # plugins/*/docs/wiki. markdownlint skips the wiki on purpose; this is its gate.
      - run: npm run lint:wiki

  lint-changelog:
    name: Lint release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Fragment format, and that nobody hand-edited CHANGELOG.md -> "## Unreleased". Editing
      # that section conflicts with every other open PR, and after a release the edit lands in
      # the already-published section where no release will ever read it.
      - run: npm run lint:changelog

      # Informational: a PR that changes a plugin usually owes a release note. Pure refactors,
      # typo fixes and lint changes legitimately owe nothing, so this never fails the build.
      - name: Remind about a missing release note
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$(git merge-base "$BASE" HEAD)"..HEAD)
          missing=0
          for dir in plugins/*/; do
            name=${dir#plugins/}; name=${name%/}
            touched=$(echo "$changed" | grep -E "^plugins/$name/" | grep -vE "^plugins/$name/(CHANGELOG\.md|changelog\.d/)" || true)
            [ -n "$touched" ] || continue
            note=$(echo "$changed" | grep -E "^plugins/$name/changelog\.d/[^/]+\.md$" | grep -v "/README\.md$" || true)
            if [ -z "$note" ]; then
              echo "::warning title=No release note for $name::This PR changes plugins/$name/ but adds no file under plugins/$name/changelog.d/. Add one unless the change is invisible to whoever installs the plugin (a refactor, a typo, a lint fix)."
              missing=1
            else
              echo "Release note for $name: $note"
            fi
          done
          [ "$missing" -eq 1 ] || echo "Every changed plugin has a release note."

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck on plugin and repo scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          ignore_paths: node_modules
          severity: warning

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Plugins carry MCP configs and customer-facing templates; a leaked key or
      # customer credential here ships to every machine that installs the plugin.
      # No base/head: the action derives the commit range from the event itself
      # (before..after on push, base..head on pull_request). Passing them explicitly
      # makes a direct push to main fail with "BASE and HEAD commits are the same".
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  version-preview:
    name: Version bump preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Informational only: shows which plugin versions the Release workflow will bump
      # once this PR merges, and at which level (from the PR title / commit messages).
      # Bump the version by hand in the PR to choose a different one.
      - name: Preview
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/bump-version.mjs --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
