name: Release

# Merging to main is the release. On every push to main this workflow:
#   1. bumps the version of each plugin whose files changed, unless the PR already bumped
#      it by hand (scripts/bump-version.mjs — level from the squash-merge title:
#      "feat:" → minor, "feat!:" / "BREAKING CHANGE" → major, anything else → patch);
#   2. folds each plugin's changelog.d/*.md release-note fragments into "## Unreleased", then
#      rolls that section into a "## <version>" one and deletes the fragments
#      (scripts/changelog.mjs) — the notes themselves are written in the PR, one fragment file
#      per PR so two open PRs never conflict over them, see CLAUDE.md → "Release notes";
#   3. commits the bump and the rolled changelog back to main with [skip ci] so it does not
#      trigger itself;
#   4. tags every plugin whose version is new as <plugin>-v<version> and publishes a
#      GitHub Release whose body is that version's changelog section.
#
# Step 3 pushes to main, and a ruleset protecting main will reject that push unless the
# pusher may bypass it. GITHUB_TOKEN cannot. Do one of:
#   - add a fine-grained PAT (contents: write) or GitHub App token as the RELEASE_TOKEN
#     secret, and list it as a bypass actor on the ruleset; or
#   - add the repository's GitHub Actions as a bypass actor on the ruleset.
# With neither, every merge stalls at the push: no version bump, no tag, no release. The
# step fails loudly and names the missing piece rather than leaving a bare GH013 behind.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, release
    runs-on: ubuntu-latest
    # The bump commit itself carries [skip ci]; this guard covers manual re-runs of it.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Bump versions of changed plugins
        id: bump
        env:
          # github.event.before is the previous tip of main for a normal push. On a
          # force-push or manual dispatch it may be unusable; the script falls back to HEAD~1.
          BASE: ${{ github.event.before }}
        run: node scripts/bump-version.mjs

      # Fold this release's fragments into "## Unreleased" and delete them, then move that
      # section to "## <version> — <date>". Safe to re-run: with no fragments collect changes
      # nothing, and a changelog that already has a section for the version is left alone.
      - name: Collect release-note fragments and roll the changelog
        run: |
          set -euo pipefail
          for m in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$m" ] || continue
            name=$(jq -r .name "$m")
            version=$(jq -r '.version // empty' "$m")
            [ -n "$version" ] || continue
            node scripts/changelog.mjs collect "$name"
            node scripts/changelog.mjs roll "$name" "$version"
          done

      # Not gated on the bump: a PR that set the version by hand still needs its changelog rolled.
      - name: Commit the bump and the rolled changelog
        env:
          SUMMARY: ${{ steps.bump.outputs.summary }}
          RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN && '1' || '' }}
        run: |
          set -euo pipefail
          git add -A plugins/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): ${SUMMARY:-roll changelog} [skip ci]"

          # A ruleset on main rejects this push unless the *pusher* is covered by its bypass
          # list. This is not an authentication failure — the job always has a token — and
          # saying "add a token" sends people looking for the wrong thing.
          if ! git push origin HEAD:main; then
            echo "::error title=Release blocked by branch protection::\
          Nothing was tagged or released: the version bump and rolled changelog could not be \
          pushed to main. This is NOT a missing token — the job authenticated fine as \
          ${RELEASE_TOKEN_SET:+RELEASE_TOKEN}${RELEASE_TOKEN_SET:-GITHUB_TOKEN}. A ruleset on \
          main requires every change to arrive via a pull request, and whoever pushed is not \
          covered by that ruleset's bypass list. The fix is to push as someone who is. If the \
          bypass list contains a repository role, a fine-grained PAT or App token belonging to \
          somebody holding that role, stored as the RELEASE_TOKEN secret, is the quickest route \
          and needs no change to the ruleset. Otherwise an organization owner can add GitHub \
          Actions itself to the bypass list — a repository admin cannot, the API rejects it. \
          Check the list at GitHub → Settings → Rules. Then re-run this workflow."
            exit 1
          fi

      - name: Tag and release plugins with a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          for m in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$m" ] || continue
            name=$(jq -r .name "$m")
            version=$(jq -r '.version // empty' "$m")
            [ -n "$version" ] || { echo "$name has no version — skipping"; continue; }
            tag="${name}-v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 \
               || gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released — skipping"
              continue
            fi
            echo "Releasing $tag at $sha"
            # Body = that version's changelog section, then the install reminder. --generate-notes
            # appends GitHub's own "Full Changelog" compare link underneath.
            notes=$(mktemp)
            {
              node scripts/changelog.mjs extract "$name" "$version"
              echo
              echo "---"
              echo "Plugin \`$name\` version \`$version\`. Update: \`/plugin marketplace update helloretail\` then \`/reload-plugins\`."
            } > "$notes"
            gh release create "$tag" \
              --target "$sha" \
              --title "$tag" \
              --generate-notes \
              --notes-file "$notes"
          done
